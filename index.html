<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3日間スケジュール</title>
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e2e6ee;
  --accent:#2f6fed; --accent-soft:#e7efff; --lock:#c98a00; --lock-soft:#fff5d6;
  --sat:#2f6fed; --sun:#d93838; --danger:#d93838; --ok:#1f9d55;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151c; --card:#1b2029; --text:#e6e9ef; --muted:#9aa3b5; --line:#2c3340;
    --accent:#6b9bff; --accent-soft:#1f2c4a; --lock:#f0bb3a; --lock-soft:#3a3218;
    --sat:#6b9bff; --sun:#ff6b6b; --danger:#ff6b6b; --ok:#4cc38a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 0;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.icon-btn{border:none;background:none;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--bg);color:var(--text)}
#syncBtn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
#syncBtn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#syncBtn.ok .dot{background:var(--ok)} #syncBtn.err .dot{background:var(--danger)}
#syncBtn.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.tabs{display:none}
.day{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:200px;cursor:pointer}
.day.sel{border-color:var(--accent)}
.day h2{font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.day h2 .rel{font-size:12px;color:var(--muted);font-weight:normal}
.sat{color:var(--sat)} .sun{color:var(--sun)}
.items{list-style:none;margin:0 0 10px;padding:0}
.item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.item input[type=checkbox]{width:18px;height:18px;flex:none}
.item .mv{display:flex;flex:none}
.item .mv button{border:none;background:none;color:var(--muted);padding:2px 3px;font-size:12px;line-height:1;border-radius:4px}
.item .mv button:hover{background:var(--bg);color:var(--accent)}
.item .time{font-variant-numeric:tabular-nums;color:var(--accent);font-size:13px;flex:none;min-width:3em}
.item .text{flex:1;word-break:break-word;cursor:text}
.item.done .text{text-decoration:line-through;color:var(--muted)}
.item .edit{flex:1;min-width:0;padding:2px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--bg)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.add input[name=time]{width:7em;flex:none}
.add input[name=text]{flex:1 1 8em}

.viewsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.viewsw button{border:none;background:var(--card);padding:6px 10px;white-space:nowrap}
.viewsw button+button{border-left:1px solid var(--line)}
.viewsw button.sel{background:var(--accent);color:#fff}
body.cal-mode .tabs, body.cal-mode .days, body:not(.cal-mode) .cal{display:none}

.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.cal h2{font-size:16px;margin:0 0 8px}
.cal h2 select{font:inherit;font-weight:bold;color:inherit;background:var(--card);border:1px solid transparent;border-radius:8px;padding:2px 4px;cursor:pointer}
.cal h2 select:hover,.cal h2 select:focus{border-color:var(--line)}
.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd,.cal .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .wd{font-size:12px;text-align:center;padding:4px 0;color:var(--muted)}
.cal .cell{min-height:100px;padding:4px;cursor:pointer;min-width:0}
.cal .cell:hover{background:var(--accent-soft)}
.cal .cell.other{opacity:.45}
.cal .num{display:inline-block;font-size:13px;font-weight:600;padding:0 6px;border-radius:10px;margin-bottom:2px}
.cal .cell.today .num{background:var(--accent);color:#fff}
.cal .evs{font-size:12px;line-height:1.4;word-break:break-all}
.cal .sl{color:var(--muted);margin:0 3px}
.cal .ev .t{color:var(--accent);margin-right:3px;font-variant-numeric:tabular-nums}
.cal .ev.done{text-decoration:line-through;color:var(--muted)}

.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;align-self:start;
  position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.hist h2{font-size:16px;margin:0}
.hist .target{font-size:13px;color:var(--muted);margin:2px 0 8px}
.hist .target b{color:var(--accent)}
.hist input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:8px}
#hlist{overflow:auto;flex:1}
.hgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.h{display:flex;align-items:center;min-width:0;border-radius:8px;background:var(--bg)}
.h.locked{background:var(--lock-soft)}
.h .use{flex:1;min-width:0;text-align:left;border:none;background:none;padding:7px 4px 7px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .use:hover{color:var(--accent)}
.h .icon-btn{padding:4px 2px;font-size:12px;flex:none}
.h .lock.on{color:var(--lock)}
.hmore{margin-top:8px}
.hmore summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 4px;border-radius:8px}
.hmore summary:hover{color:var(--accent)}
.hmore .hgrid{margin-top:4px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
dialog .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog .note{font-size:12px;color:var(--muted);margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:.95}

@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;font-size:14px;line-height:1.3}
  .tabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs button small{display:block;font-size:11px;opacity:.8}
  .days{grid-template-columns:1fr}
  .day{display:none;cursor:default;min-height:0}
  .day.sel{display:block;border-color:var(--line)}
  .hist{position:static;max-height:none}
  .cal{padding:8px}
  .cal .cell{min-height:68px;padding:2px}
  .cal .num{font-size:12px;padding:0 4px}
  .cal .evs{font-size:10px;line-height:1.35}
  .cal .sl{margin:0 2px}
  .cal .ev .t{display:none}
}
</style>
</head>
<body>
<header>
  <h1>3日間スケジュール</h1>
  <button class="btn" id="prev" aria-label="前の日">◀</button>
  <button class="btn" id="today">今日</button>
  <button class="btn" id="next" aria-label="次の日">▶</button>
  <button class="icon-btn" id="syncBtn" title="今すぐ同期"><span class="dot"></span><span id="syncText">未接続</span></button>
  <button class="icon-btn" id="settingsBtn" title="設定" aria-label="設定">⚙</button>
  <div class="viewsw" id="viewsw">
    <button data-view="3day">3日間</button><button data-view="cal">カレンダー</button>
  </div>
</header>

<main>
  <section>
    <div class="tabs" id="tabs"></div>
    <div class="days" id="days"></div>
    <div class="cal" id="cal"></div>
  </section>
  <aside class="hist">
    <h2>予定履歴</h2>
    <div class="target" id="target"></div>
    <input type="search" id="hfilter" placeholder="履歴を絞り込み">
    <div id="hlist"></div>
  </aside>
</main>

<dialog id="settings">
  <h3>設定・pCloud同期</h3>
  <div id="connState"></div>
  <label for="cfgClient">pCloud App Key（client_id）</label>
  <input type="text" id="cfgClient" autocomplete="off" spellcheck="false">
  <label for="cfgApp">pCloudに登録したアプリ名</label>
  <input type="text" id="cfgApp" autocomplete="off" spellcheck="false">
  <label for="cfgLink">schedule.json の共有リンク（読み込み用）</label>
  <input type="text" id="cfgLink" autocomplete="off" spellcheck="false" placeholder="https://u.pcloud.link/publink/show?code=…">
  <label for="cfgPass">暗号化パスワード（全端末で同じものを1回入力）</label>
  <input type="password" id="cfgPass" autocomplete="new-password">
  <div class="note" id="passNote"></div>
  <div class="note">データは pCloud の「Applications / アプリ名」フォルダに schedule.json として保存されます</div>
  <div class="note">pCloud はブラウザからのファイル読み込みを認めていないため、schedule.json の「ダウンロードリンク」経由で読み込みます（README参照）</div>
  <div class="note">Redirect URI（pCloudのアプリ設定に登録）: <code id="redirectUri"></code></div>
  <div class="row">
    <button class="btn primary" id="connectBtn">pCloudに接続</button>
    <button class="btn" id="disconnectBtn">切断</button>
    <button class="btn" id="syncNowBtn">今すぐ同期</button>
  </div>
  <label>バックアップ</label>
  <div class="row" style="margin-top:0">
    <button class="btn" id="exportBtn">JSONを書き出し</button>
    <button class="btn" id="importBtn">JSONを読み込み（統合）</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="closeSettings">閉じる</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
'use strict';
const LS_DATA = 'tds_data', LS_CFG = 'tds_pcloud', SS_STATE = 'tds_oauth_state';
const HISTORY_LIMIT = 200;          // ロックしていない履歴の上限
const HISTORY_ROWS = 14;            // 履歴を常に表示する段数（1段2個）。それ以降は折りたたみ
const TOMBSTONE_DAYS = 60;          // 削除記録を残す日数（他端末への削除反映用）
const $ = s => document.querySelector(s);

function loadLS(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } }
function saveLS(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  return { version:1, entries: d.entries || {}, history: d.history || {} };
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();

const FILE_NAME = 'schedule.json';
let cfg = Object.assign({ clientId:'', appName:'', token:'', host:'', folderId:null, folderLabel:'', pubCode:'', pubFileId:null, encKey:'' }, loadLS(LS_CFG) || {});
try{ localStorage.removeItem('tds_dbx') }catch(e){}   // 旧 Dropbox 設定
let data = normalize(loadLS(LS_DATA));
let offset = 0, selected = 0, editingId = null;
let view = '3day', calMonth = null;   // calMonth: カレンダーに表示中の月の1日

/* ---------- 日付 ---------- */
const WD = ['日','月','火','水','木','金','土'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function dayAt(i){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offset+i); return d }
function relLabel(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d - t) / 864e5);
  return {'-1':'昨日','0':'今日','1':'明日','2':'明後日'}[diff] || (diff > 0 ? diff+'日後' : -diff+'日前');
}
function wdClass(d){ return d.getDay()===0 ? 'sun' : d.getDay()===6 ? 'sat' : '' }
function shortDate(d){ return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})` }

/* ---------- データ操作 ---------- */
function commit(){ data.version = 1; saveLS(LS_DATA, data); render(); scheduleSync(); }

function touchHistory(text){
  text = text.trim(); if(!text) return;
  const h = data.history[text];
  data.history[text] = { text, locked: h && !h.deleted ? !!h.locked : false,
    count: (h && !h.deleted ? h.count||0 : 0) + 1, lastUsed: now(), updatedAt: now(), deleted:false };
  // ロックなし履歴が多すぎる場合は古いものから削除
  const free = Object.values(data.history).filter(x => !x.deleted && !x.locked).sort((a,b)=>b.lastUsed-a.lastUsed);
  free.slice(HISTORY_LIMIT).forEach(x => { data.history[x.text] = { ...x, deleted:true, updatedAt:now() } });
}
function addEntry(date, text, time){
  text = text.trim(); if(!text) return;
  const id = uid();
  data.entries[id] = { id, date, time: time||'', text, done:false, createdAt:now(), updatedAt:now(), deleted:false };
  touchHistory(text);
  commit();
}
function updateEntry(id, patch){
  const e = data.entries[id]; if(!e) return;
  data.entries[id] = { ...e, ...patch, updatedAt: now() };
  if(patch.text) touchHistory(patch.text);
  commit();
}
function entriesOf(date){
  return Object.values(data.entries).filter(e => !e.deleted && e.date === date).sort((a,b)=>{
    if(a.time && b.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
    if(!!a.time !== !!b.time) return a.time ? -1 : 1;     // 時刻なしは後ろ
    return (a.createdAt||0) - (b.createdAt||0);
  });
}
function sortedHistory(){
  // ロック済みが先頭、その中・外それぞれ最近使った順
  return Object.values(data.history).filter(h => !h.deleted)
    .sort((a,b) => (b.locked - a.locked) || (b.lastUsed - a.lastUsed));
}

/* ---------- 描画 ---------- */
function render(){
  const days = [0,1,2].map(dayAt);
  $('#tabs').innerHTML = days.map((d,i)=>
    `<button data-tab="${i}" class="${i===selected?'sel':''}"><span class="${i===selected?'':wdClass(d)}">${shortDate(d)}</span><small>${relLabel(d)}</small></button>`).join('');

  $('#days').innerHTML = days.map((d,i)=>{
    const date = ymd(d), list = entriesOf(date);
    return `<article class="day ${i===selected?'sel':''}" data-idx="${i}">
      <h2><span class="${wdClass(d)}">${shortDate(d)}</span><span class="rel">${relLabel(d)}</span></h2>
      <ul class="items">${list.length ? list.map(e => `
        <li class="item ${e.done?'done':''}" data-id="${e.id}">
          <input type="checkbox" data-act="toggle" ${e.done?'checked':''} aria-label="完了">
          <span class="mv"><button data-act="mv" data-d="-1" title="前の日へ移動" aria-label="前の日へ移動">◀</button><button data-act="mv" data-d="1" title="次の日へ移動" aria-label="次の日へ移動">▶</button></span>
          <span class="time">${esc(e.time)}</span>
          ${editingId===e.id
            ? `<input class="edit" data-act="editbox" value="${esc(e.text)}">`
            : `<span class="text" data-act="edit" title="クリックで編集">${esc(e.text)}</span>`}
          <button class="icon-btn" data-act="del" title="削除" aria-label="削除">✕</button>
        </li>`).join('') : '<li class="empty">予定はありません</li>'}</ul>
      <form class="add" data-date="${date}">
        <input type="time" name="time" aria-label="時刻">
        <input name="text" placeholder="予定を入力" autocomplete="off" enterkeyhint="done">
        <button class="btn primary">追加</button>
      </form>
    </article>`;
  }).join('');

  $('#target').innerHTML = `クリックで <b>${shortDate(days[selected])}</b> に追加`;
  renderHistory();

  document.body.classList.toggle('cal-mode', view === 'cal');
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('sel', b.dataset.view === view));
  const unit = view === 'cal' ? '月' : '日';
  for(const [id, w] of [['#prev','前'], ['#next','次']]){ $(id).title = `${w}の${unit}`; $(id).setAttribute('aria-label', `${w}の${unit}`); }
  if(view === 'cal') renderCal();

  if(editingId){ const box = document.querySelector('.edit'); if(box){ box.focus(); box.select(); } }
}
// 予定は省略せず全件表示。多い日はその週の行が縦に伸びる
function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());   // 月初を含む週の日曜
  const weeks = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const today = ymd(new Date());
  let cells = '';
  for(let i = 0; i < weeks * 7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), date = ymd(d);
    const list = entriesOf(date);
    cells += `<div class="cell ${d.getMonth() !== m ? 'other' : ''} ${date === today ? 'today' : ''}" data-date="${date}" title="${shortDate(d)} を3日間表示で開く">
      <span class="num ${wdClass(d)}">${d.getDate()}</span>
      ${list.length ? `<div class="evs">${list.map(e => `<span class="ev ${e.done?'done':''}">${e.time ? `<span class="t">${esc(e.time)}</span>` : ''}${esc(e.text)}</span>`).join('<span class="sl">/</span>')}</div>` : ''}
    </div>`;
  }
  // 年月プルダウン：表示中の月の前後2年分
  let opts = '';
  for(let k = -24; k <= 24; k++){
    const d = new Date(y, m + k, 1), v = d.getFullYear() + '-' + (d.getMonth() + 1);
    opts += `<option value="${v}" ${k === 0 ? 'selected' : ''}>${d.getFullYear()}年${d.getMonth() + 1}月</option>`;
  }
  $('#cal').innerHTML = `<h2><select id="calPick" aria-label="年月を選ぶ">${opts}</select></h2>
    <div class="grid">${WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}${cells}</div>`;
}
function setView(v){
  if(v === 'cal'){ const d = dayAt(selected); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  view = v; editingId = null; render();
}
// 押した日付を真ん中にした3日間（前日・当日・翌日）を表示する
function openDate(date){
  const [y, m, d] = date.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  offset = Math.round((new Date(y, m - 1, d) - t) / 864e5) - 1;
  selected = 1; view = '3day'; render();
  window.scrollTo(0, 0);
}
function renderHistory(){
  const q = $('#hfilter').value.trim().toLowerCase();
  const list = sortedHistory().filter(h => !q || h.text.toLowerCase().includes(q));
  const box = $('#hlist');
  if(!list.length){ box.innerHTML = `<div class="empty">${q ? '該当なし' : '予定を書き込むとここに履歴が表示されます'}</div>`; return; }
  // 上位 HISTORY_ROWS 段（1段2個）は常に表示、残りは折りたたみ。開閉状態は再描画でも保つ
  const wasOpen = !!box.querySelector('.hmore')?.open;
  const item = h => `<li class="h ${h.locked?'locked':''}" data-key="${esc(h.text)}">
      <button class="use" data-act="use" title="${esc(h.text)}">${esc(h.text)}</button>
      <button class="icon-btn lock ${h.locked?'on':''}" data-act="lock" title="${h.locked?'ロック解除':'ロック（先頭に固定）'}">${h.locked?'🔒':'🔓'}</button>
      ${h.locked ? '' : '<button class="icon-btn" data-act="hdel" title="履歴から削除" aria-label="履歴から削除">✕</button>'}
    </li>`;
  const top = list.slice(0, HISTORY_ROWS * 2), rest = list.slice(HISTORY_ROWS * 2);
  box.innerHTML = `<ul class="hgrid">${top.map(item).join('')}</ul>` + (rest.length ?
    `<details class="hmore" ${wasOpen?'open':''}><summary>その他の履歴（${rest.length}件）</summary><ul class="hgrid">${rest.map(item).join('')}</ul></details>` : '');
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('show'), 1600); }

/* ---------- イベント ---------- */
const shiftMonth = n => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1); render() };
$('#prev').onclick = () => { if(view === 'cal') shiftMonth(-1); else { offset--; render() } };
$('#next').onclick = () => { if(view === 'cal') shiftMonth(1); else { offset++; render() } };
$('#today').onclick = () => {
  if(view === 'cal'){ const t = new Date(); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); render(); }
  else { offset = 0; selected = 0; render() }
};
$('#viewsw').onclick = e => { const b = e.target.closest('[data-view]'); if(b) setView(b.dataset.view) };
$('#cal').onclick = e => { const c = e.target.closest('.cell'); if(c) openDate(c.dataset.date) };
$('#cal').onchange = e => {
  if(e.target.id !== 'calPick') return;
  const [y, m] = e.target.value.split('-').map(Number);
  calMonth = new Date(y, m - 1, 1); render();
};
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if(b){ selected = +b.dataset.tab; render() } };
$('#hfilter').oninput = renderHistory;

$('#days').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, text = f.text.value;
  if(!text.trim()) return;
  selected = +f.closest('.day').dataset.idx;
  addEntry(f.dataset.date, text, f.time.value);
  const nf = document.querySelector(`.add[data-date="${f.dataset.date}"]`);
  if(nf) nf.text.focus();
});
// 再描画せずに選択日だけ切り替える（入力中のフォーカスを保つため）
function selectDay(i){
  if(i === selected) return;
  selected = i;
  document.querySelectorAll('.day').forEach(x => x.classList.toggle('sel', +x.dataset.idx === i));
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('sel', +x.dataset.tab === i));
  $('#target').innerHTML = `クリックで <b>${shortDate(dayAt(i))}</b> に追加`;
}
$('#days').addEventListener('focusin', e => { const day = e.target.closest('.day'); if(day) selectDay(+day.dataset.idx) });
$('#days').addEventListener('click', e => {
  const day = e.target.closest('.day');
  if(day) selectDay(+day.dataset.idx);
  const act = e.target.dataset.act, li = e.target.closest('.item'); if(!li) return;
  const id = li.dataset.id;
  if(act === 'toggle') updateEntry(id, { done: e.target.checked });
  else if(act === 'del'){ data.entries[id] = { ...data.entries[id], deleted:true, updatedAt:now() }; commit(); }
  else if(act === 'edit'){ editingId = id; render(); }
  else if(act === 'mv'){
    const [y, m, d] = data.entries[id].date.split('-').map(Number);
    const to = new Date(y, m - 1, d + +e.target.dataset.d);
    updateEntry(id, { date: ymd(to) });
    toast(`${shortDate(to)} に移動しました`);
  }
});
function finishEdit(box, save){
  if(!editingId) return;
  const id = editingId; editingId = null;
  const v = box.value.trim();
  if(save && v && v !== data.entries[id].text) updateEntry(id, { text: v }); else render();
}
$('#days').addEventListener('keydown', e => {
  if(e.target.dataset.act !== 'editbox') return;
  if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); finishEdit(e.target, true) }
  if(e.key === 'Escape') finishEdit(e.target, false);
});
$('#days').addEventListener('focusout', e => { if(e.target.dataset.act === 'editbox') finishEdit(e.target, true) });

$('#hlist').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act, li = e.target.closest('.h'); if(!li || !act) return;
  const key = li.dataset.key, h = data.history[key]; if(!h) return;
  if(act === 'use'){
    const date = ymd(dayAt(selected));
    const f = document.querySelector(`.add[data-date="${date}"]`);
    addEntry(date, h.text, f ? f.time.value : '');
    toast(`${shortDate(dayAt(selected))} に追加しました`);
  } else if(act === 'lock'){
    data.history[key] = { ...h, locked: !h.locked, updatedAt: now() }; commit();
  } else if(act === 'hdel'){
    data.history[key] = { ...h, deleted:true, updatedAt: now() }; commit();
  }
});

/* ---------- pCloud 同期 ---------- */
const connected = () => !!(cfg.token && cfg.host);
const AUTH_ERRORS = [1000, 2000, 2094, 2095];
let syncing = false, syncAgain = false, syncTimer = null;

function setStatus(kind, text){
  const b = $('#syncBtn'); b.className = 'icon-btn ' + kind; $('#syncText').textContent = text; b.title = text;
}
// CORS プリフライトを避けるため、トークンはヘッダでなくクエリで渡す
function apiUrl(method, params){
  const u = new URL(`https://${cfg.host}/${method}`);
  for(const k in params) u.searchParams.set(k, params[k]);
  u.searchParams.set('access_token', cfg.token);
  return u;
}
async function check(res){
  const j = await res.json();
  if(j.result !== 0){ const err = new Error(j.error || 'pCloud error ' + j.result); err.code = j.result; throw err; }
  return j;
}
const api = (method, params) => fetch(apiUrl(method, params), { cache:'no-store' }).then(check);

// アプリ専用フォルダ（pCloud の /Applications/<アプリ名>）を特定する。
// トークンから見たルート(folderid 0)がそのアプリフォルダになる場合と、
// /Applications/<アプリ名> として見える場合の両方に対応する。
async function resolveFolder(){
  if(cfg.folderId != null) return cfg.folderId;
  let meta;
  try{
    meta = (await api('listfolder', { folderid: 0, nofiles: 1 })).metadata;
  }catch(e){
    if(e.code !== 2003 && e.code !== 2005) throw e;
    meta = null;
  }
  const hasApps = meta && (meta.contents || []).some(c => c.isfolder && c.name === 'Applications');
  if((!meta || hasApps) && cfg.appName){
    try{ meta = (await api('listfolder', { path: '/Applications/' + cfg.appName, nofiles: 1 })).metadata; }
    catch(e){ if(!meta) throw e; }
  }
  if(!meta) throw new Error('アプリ専用フォルダが見つかりません。設定でアプリ名を確認してください');
  cfg.folderId = meta.folderid;
  cfg.folderLabel = meta.path || (hasApps ? '/' : '/Applications/' + (cfg.appName || '（アプリ名）'));
  saveLS(LS_CFG, cfg);
  return cfg.folderId;
}
/* 暗号化：共有リンクは知っていれば誰でも読めるので、pCloud 上の schedule.json は AES-GCM で暗号化する。
   鍵はパスワードから PBKDF2 で作り、端末ごとに cfg.encKey（パスワード自体は保存しない）に覚える。
   ファイル形式 { enc:'AES-GCM', v:1, iv, data }（base64）。全端末で同じパスワードが必要 */
const ENC_SALT = 'my-3day-k7q2:schedule.json', ENC_ITER = 310000;
let remotePlain = false;   // 直前に読んだ pCloud のファイルが平文だったか（暗号化して書き直すため）
function toB64(buf){
  const b = new Uint8Array(buf); let s = '';
  for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: new TextEncoder().encode(ENC_SALT), iterations: ENC_ITER, hash:'SHA-256' }, base, 256);
  return toB64(bits);
}
const aesKey = () => crypto.subtle.importKey('raw', fromB64(cfg.encKey), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function encryptData(d){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await aesKey(), new TextEncoder().encode(JSON.stringify(d)));
  return JSON.stringify({ enc:'AES-GCM', v:1, iv: toB64(iv), data: toB64(ct) });
}
async function decryptData(j){
  if(!cfg.encKey) throw new Error('pCloud のデータは暗号化されています。⚙ で暗号化パスワードを入力してください');
  let pt;
  try{ pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: fromB64(j.iv) }, await aesKey(), fromB64(j.data)); }
  catch(e){ throw new Error('暗号化パスワードが違います（ほかの端末と同じパスワードにしてください）'); }
  return JSON.parse(new TextDecoder().decode(pt));
}
async function pullRemote(){
  const folderid = await resolveFolder();
  let list;
  try{ list = await api('listfolder', { folderid }); }
  catch(e){ if(e.code === 2005){ cfg.folderId = null; saveLS(LS_CFG, cfg); } throw e; }
  const f = (list.metadata.contents || []).find(c => !c.isfolder && c.name === FILE_NAME);
  if(!f) return null;                                       // まだファイルが無い
  // getfilelink 等はブラウザから使えない（7010 Invalid link referer）ので、
  // ユーザーが作った共有リンク経由で getpubtextfile で読む。uploadfile の上書きでも fileid は変わらない
  if(!cfg.pubCode) throw new Error('⚙ で schedule.json の共有リンクを設定してください');
  if(cfg.pubFileId == null){                                // リンク先が本当にこのファイルか一度だけ確認
    const s = await fetch(`https://${cfg.host}/showpublink?code=${encodeURIComponent(cfg.pubCode)}`, { cache:'no-store' }).then(r => r.json());
    if(s.result !== 0) throw new Error('共有リンクを確認できません: ' + (s.error || s.result));
    cfg.pubFileId = s.metadata.fileid; saveLS(LS_CFG, cfg);
  }
  if(cfg.pubFileId !== f.fileid){ cfg.pubFileId = null; saveLS(LS_CFG, cfg); throw new Error('共有リンクが保存先の schedule.json のものではありません'); }
  const res = await fetch(`https://${cfg.host}/getpubtextfile?code=${encodeURIComponent(cfg.pubCode)}`, { cache:'no-store' });
  const j = await res.json();
  if(typeof j.result === 'number' && !j.entries && !j.enc){ const err = new Error('共有リンクを読めません: ' + (j.error || j.result)); err.code = j.result; throw err; }
  remotePlain = !j.enc;
  return normalize(j.enc ? await decryptData(j) : j);
}
async function pushRemote(d){
  const folderid = await resolveFolder();
  const fd = new FormData();
  const body = cfg.encKey ? await encryptData(d) : JSON.stringify(d);
  fd.append('file', new Blob([body], { type:'application/json' }), FILE_NAME);
  await fetch(apiUrl('uploadfile', { folderid, nopartial: 1 }), { method:'POST', body: fd }).then(check);
}

function mergeMap(a, b){
  const out = { ...a };
  for(const k in b) if(!out[k] || (b[k].updatedAt||0) > (out[k].updatedAt||0)) out[k] = b[k];
  return out;
}
function purge(d){
  const limit = now() - TOMBSTONE_DAYS * 864e5;
  for(const m of [d.entries, d.history]) for(const k in m) if(m[k].deleted && (m[k].updatedAt||0) < limit) delete m[k];
  return d;
}
function sameMap(a, b){
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => b[k] && b[k].updatedAt === a[k].updatedAt);
}
const sameData = (a, b) => sameMap(a.entries, b.entries) && sameMap(a.history, b.history);

async function sync(){
  if(!connected()) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; setStatus('busy', '同期中…');
  try{
    const remote = await pullRemote();
    const merged = purge(normalize({
      entries: mergeMap(data.entries, remote ? remote.entries : {}),
      history: mergeMap(data.history, remote ? remote.history : {}),
    }));
    if(!sameData(merged, data)){ data = merged; saveLS(LS_DATA, data); if(!editingId) render(); }
    if(!remote || (remotePlain && cfg.encKey) || !sameData(merged, remote)) await pushRemote(merged);
    const t = new Date();
    setStatus('ok', `同期済み ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`);
  }catch(e){
    console.error(e);
    if(AUTH_ERRORS.includes(e.code)){ cfg.token = ''; saveLS(LS_CFG, cfg); setStatus('err', '再接続が必要'); }
    else setStatus('err', '同期エラー');
    toast('同期できませんでした: ' + e.message);
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; sync(); }
  }
}
function scheduleSync(){ if(!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1200); }

function redirectUri(){ return location.origin + location.pathname }
// OAuth2 implicit flow（ブラウザだけで完結、client secret 不要）。トークンは #access_token で戻る
async function connect(){
  await readSettingsForm();
  if(!cfg.clientId){ alert('pCloud の App Key（client_id）を入力してください'); return; }
  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){ alert('pCloud接続はhttpsで公開したページから行ってください（README参照）'); return; }
  const state = uid(); sessionStorage.setItem(SS_STATE, state);
  const u = new URL('https://my.pcloud.com/oauth2/authorize');
  u.search = new URLSearchParams({ client_id: cfg.clientId, response_type:'token', redirect_uri: redirectUri(), state });
  location.href = u;
}
function handleOAuthReturn(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(!h.has('access_token') && !h.has('error')) return;
  const expected = sessionStorage.getItem(SS_STATE);
  sessionStorage.removeItem(SS_STATE);
  history.replaceState(null, '', location.pathname + location.search);
  if(h.has('error')){ toast('接続がキャンセルされました'); return; }
  if(!expected || h.get('state') !== expected){ toast('接続を確認できませんでした。もう一度お試しください'); return; }
  cfg.token = h.get('access_token');
  cfg.host = h.get('hostname') || (h.get('locationid') === '2' ? 'eapi.pcloud.com' : 'api.pcloud.com');
  cfg.folderId = null;
  saveLS(LS_CFG, cfg);
  toast('pCloudに接続しました');
}
// 設定欄の値を保存。App Key が変わったら接続し直し、アプリ名が変わったら保存先フォルダを探し直す
// 暗号化パスワードは入力があったときだけ鍵に変換して保存（パスワード自体は保存しない）
async function readSettingsForm(){
  const clientId = $('#cfgClient').value.trim(), appName = $('#cfgApp').value.trim();
  const link = $('#cfgLink').value.trim(), pubCode = (link.match(/[?&]code=([^&#\s]+)/) || [, link])[1];
  const keyChanged = clientId !== cfg.clientId, changed = keyChanged || appName !== cfg.appName || pubCode !== cfg.pubCode;
  if(pubCode !== cfg.pubCode) cfg.pubFileId = null;
  cfg.clientId = clientId; cfg.appName = appName; cfg.pubCode = pubCode;
  if(keyChanged){ cfg.token = ''; cfg.host = ''; }
  if(changed) cfg.folderId = null;
  const pass = $('#cfgPass').value;
  $('#cfgPass').value = '';
  let passChanged = false;
  if(pass){
    if(!window.crypto || !crypto.subtle) alert('暗号化はhttpsで公開したページでのみ使えます');
    else { const k = await deriveKey(pass); passChanged = k !== cfg.encKey; cfg.encKey = k; }
  }
  saveLS(LS_CFG, cfg);
  return changed || passChanged;
}

/* ---------- 設定ダイアログ ---------- */
function openSettings(){
  $('#cfgClient').value = cfg.clientId;
  $('#cfgApp').value = cfg.appName;
  $('#cfgLink').value = cfg.pubCode ? 'https://u.pcloud.link/publink/show?code=' + cfg.pubCode : '';
  $('#cfgPass').value = '';
  $('#cfgPass').placeholder = cfg.encKey ? '設定済み（変えるときだけ入力）' : '未設定';
  $('#passNote').textContent = cfg.encKey
    ? 'この端末には暗号化パスワードが設定されています。pCloud には暗号化して保存します'
    : '未設定のままだと、共有リンクを知っている人は予定を読めます。忘れると pCloud 上のデータは誰にも読めません';
  $('#redirectUri').textContent = redirectUri();
  const where = cfg.folderId != null ? `<br>保存先: ${esc(cfg.folderLabel || '')}/${FILE_NAME}` : '';
  $('#connState').innerHTML = connected()
    ? `<span style="color:var(--ok)">● pCloudに接続中</span>（${esc(cfg.host)}）${where}`
    : '<span style="color:var(--muted)">● 未接続（この端末の中だけに保存されています）</span>';
  $('#settings').showModal();
}
$('#settingsBtn').onclick = openSettings;
$('#closeSettings').onclick = async () => {
  const changed = await readSettingsForm(); $('#settings').close();
  if(!connected()) setStatus('', '未接続'); else if(changed) sync();
};
$('#connectBtn').onclick = connect;
$('#disconnectBtn').onclick = () => { cfg.token = ''; cfg.host = ''; cfg.folderId = null; cfg.encKey = ''; saveLS(LS_CFG, cfg); setStatus('', '未接続'); openSettings(); };
$('#syncNowBtn').onclick = async () => { await readSettingsForm(); $('#settings').close(); sync(); };
$('#syncBtn').onclick = () => connected() ? sync() : openSettings();
$('#exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }));
  a.download = `schedule-${ymd(new Date())}.json`; a.click();
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = normalize(JSON.parse(await f.text()));
    data = normalize({ entries: mergeMap(data.entries, d.entries), history: mergeMap(data.history, d.history) });
    commit(); toast('読み込みました');
  }catch(err){ alert('読み込めませんでした: ' + err.message) }
  e.target.value = '';
};

/* ---------- 起動 ---------- */
handleOAuthReturn();
render();
if(connected()){ sync(); } else { setStatus('', '未接続'); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ render(); sync(); } });
setInterval(() => { if(document.visibilityState === 'visible' && !editingId) sync(); }, 60000);
// 日付が変わったら表示を更新
let lastDay = ymd(new Date());
setInterval(() => { const d = ymd(new Date()); if(d !== lastDay){ lastDay = d; if(!editingId) render(); } }, 60000);
</script>
